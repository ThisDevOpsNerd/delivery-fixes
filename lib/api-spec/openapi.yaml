openapi: 3.1.0
info:
  title: Api
  version: 0.2.0
  description: Delivery Fixes API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
  - name: delivery-fixes
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /delivery-issues:
    get:
      operationId: listDeliveryIssues
      tags: [delivery-fixes]
      summary: Load delivery issues from open, unfulfilled Shopify orders
      responses:
        "200":
          description: Current delivery issue queue
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeliveryIssueQueue"
        "502":
          description: Shopify could not be reached
  /delivery-issues/resolve:
    post:
      operationId: resolveDeliveryIssue
      tags: [delivery-fixes]
      summary: Apply a corrected shipping address to Shopify
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeliveryIssueResolution"
      responses:
        "200":
          description: Updated Shopify order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeliveryIssueResolutionResult"
        "400":
          description: Invalid address or Shopify rejected the update
        "502":
          description: Shopify could not be reached
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required: [status]
    Address:
      type: object
      properties:
        name: { type: string }
        line1: { type: string }
        line2: { type: string }
        city: { type: string }
        province: { type: string }
        postalCode: { type: string }
        country: { type: string }
      required: [name, line1, city, province, postalCode, country]
    DeliveryIssueTimelineEvent:
      type: object
      properties:
        date: { type: string, format: date-time }
        message: { type: string }
      required: [date, message]
    DeliveryIssue:
      type: object
      properties:
        id: { type: string }
        shopifyOrderId: { type: string }
        shopifyAdminUrl: { type: string }
        orderNumber: { type: string }
        customerName: { type: string }
        customerEmail: { type: string }
        issueType:
          type: string
          enum: [address_invalid, missing_apartment, carrier_rejected, zip_mismatch, po_box_unsupported]
        severity:
          type: string
          enum: [critical, warning, review]
        status:
          type: string
          enum: [open, waiting_customer, snoozed, resolved]
        createdAt: { type: string, format: date-time }
        shipBy: { type: string, format: date-time }
        carrier: { type: string }
        itemCount: { type: integer }
        orderValue: { type: number }
        currencyCode: { type: string }
        currentAddress:
          $ref: "#/components/schemas/Address"
        suggestedAddress:
          oneOf:
            - $ref: "#/components/schemas/Address"
            - type: "null"
        confidence: { type: number }
        reason: { type: string }
        timeline:
          type: array
          items:
            $ref: "#/components/schemas/DeliveryIssueTimelineEvent"
      required:
        - id
        - shopifyOrderId
        - shopifyAdminUrl
        - orderNumber
        - customerName
        - customerEmail
        - issueType
        - severity
        - status
        - createdAt
        - shipBy
        - carrier
        - itemCount
        - orderValue
        - currencyCode
        - currentAddress
        - confidence
        - reason
        - timeline
    DeliveryIssueQueue:
      type: object
      properties:
        shopName: { type: string }
        shopDomain: { type: string }
        syncedAt: { type: string, format: date-time }
        issues:
          type: array
          items:
            $ref: "#/components/schemas/DeliveryIssue"
      required: [shopName, shopDomain, syncedAt, issues]
    DeliveryIssueResolution:
      type: object
      properties:
        shopifyOrderId: { type: string, minLength: 1 }
        address:
          $ref: "#/components/schemas/Address"
      required: [shopifyOrderId, address]
    DeliveryIssueResolutionResult:
      type: object
      properties:
        shopifyOrderId: { type: string }
        updatedAt: { type: string, format: date-time }
        message: { type: string }
      required: [shopifyOrderId, updatedAt, message]